<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}
/* splash: a string of sausages flies in and twists into a balloon dog, then the red sheet lifts away */
#splash{position:fixed;inset:0;z-index:100;background:#C2372A;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px);overflow:hidden;cursor:pointer}
#splash .sp-glow{position:absolute;left:50%;top:42%;width:560px;height:560px;max-width:150vw;max-height:150vw;transform:translate(-50%,-50%) scale(.5);border-radius:50%;background:radial-gradient(circle,rgba(255,214,190,.30),rgba(255,214,190,0) 65%);opacity:0;transition:opacity 1.2s ease,transform 1.6s ease;pointer-events:none}
#splash.go .sp-glow{opacity:1;transform:translate(-50%,-50%) scale(1)}
#splash svg{width:min(86vw,360px);height:auto;display:block;position:relative;overflow:visible}
#splash .sp-word{position:relative;margin-top:4px;font-family:var(--f-display);font-weight:800;font-size:46px;line-height:1.05;letter-spacing:.5px;color:#FFF6EA;opacity:0;transform:translateY(14px);white-space:nowrap;text-align:center;transition:opacity .55s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
#splash .sp-rule{position:relative;margin-top:14px;width:104px;height:7px;border-radius:4px;background:#F2D3B0;transform:scaleX(0);transition:transform .5s cubic-bezier(.6,0,.2,1) .3s}
#splash.named .sp-word{opacity:1;transform:none}
#splash.named .sp-rule{transform:scaleX(1)}
#splash.out{animation:spLift .6s cubic-bezier(.7,0,.25,1) forwards}
@keyframes spLift{to{transform:translateY(-100%);border-radius:0 0 50% 50%/0 0 90px 90px}}
@keyframes spFade2{to{opacity:0}}
@media (prefers-reduced-motion:reduce){#splash.out{animation:spFade2 .3s ease forwards}#splash .sp-glow{transition:none}}
</style>
<title>Энергия · заказы</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column phone app, max 480px wide, fixed bottom nav and floating cart bar; single warm-light look on purpose */
:root{
  --bg:#F0EEE9; --surface:#FFFFFF; --ink:#2A1F17; --muted:#6B5B4E; --line:#E4DDD3;
  --accent:#C2372A; --accent-ink:#FFFFFF; --accent-soft:#F7E1DD;
  --ok:#2A6526; --ok-soft:#DDEFD6; --dark:#2A1F17; --dark-ink:#F6F2EC; --gold:#8C5A40;
  --f-display:'Playfair Display', Georgia, 'Times New Roman', serif;
  --f-body:'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.serif{font-family:var(--f-display)}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* login */
#login{min-height:100%;display:flex;flex-direction:column}
.login-hero{position:relative;height:46vh;min-height:300px;max-height:420px;overflow:hidden;border-radius:0 0 32px 32px}
.login-hero img{width:100%;height:100%;object-fit:cover;display:block}
.login-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(42,31,23,.85),rgba(42,31,23,0) 60%)}
.login-hero .over{position:absolute;left:0;right:0;bottom:0;z-index:1;padding-block:24px;color:var(--dark-ink)}
.login-hero .over .eyebrow{color:#E9C99A}
.login-hero h1{font-family:var(--f-display);font-size:36px;line-height:1.1;margin-top:6px}
.login-body{padding-block:24px 32px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold)}
.input{height:52px;border-radius:26px;border:1px solid var(--line);background:var(--surface);padding:0 18px;font-size:16px;width:100%}
.input.code{letter-spacing:2px;font-weight:700;text-transform:uppercase}
.btn{height:54px;border-radius:27px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(194,55,42,.28)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.dark{background:var(--dark);color:var(--dark-ink);box-shadow:none}
.btn[disabled]{opacity:.45;box-shadow:none}
.hint{font-size:13px;line-height:1.45;color:var(--muted)}
.err{font-size:13px;color:var(--accent);font-weight:700}

/* app shell */
#shell{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.top{padding-block:18px 6px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top h1{font-family:var(--f-display);font-size:30px;line-height:1.1;margin-top:4px}
.top .addr{font-size:13px;color:var(--muted);margin-top:4px}
.round{width:44px;height:44px;border-radius:22px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.demo-note{margin-top:10px;font-size:12px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
.delivery{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ok);margin-top:12px}
.delivery b{font-weight:800}
.search{display:flex;align-items:center;gap:8px;height:48px;border-radius:24px;background:var(--surface);border:1px solid var(--line);padding:0 16px;margin-top:12px}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:14px 4px;scrollbar-width:none;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--dark);color:var(--dark-ink);border-color:var(--dark)}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;margin-bottom:10px}
.sec-title h2{font-family:var(--f-display);font-size:21px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:var(--surface);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;border:0;padding:0;text-align:left;box-shadow:0 1px 0 var(--line)}
.card .ph{position:relative;aspect-ratio:1/0.82;max-width:100%;background:var(--line)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:10px;left:10px;background:var(--surface);color:var(--accent);font-size:11px;font-weight:800;padding:4px 9px;border-radius:10px}
.tag.new{color:var(--ok)}
.card .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.card .nm{font-size:14px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pk{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .rw{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:6px}
.price{font-family:var(--f-display);font-weight:800;font-size:19px;white-space:nowrap}
.price small{font-family:var(--f-body);font-size:11px;font-weight:600;color:var(--muted)}
.add{width:38px;height:38px;border-radius:19px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:0}
.incart{height:38px;padding:0 10px;border-radius:19px;background:var(--ok-soft);color:var(--ok);font-size:12.5px;font-weight:800;display:flex;align-items:center;white-space:nowrap}
.empty{background:var(--surface);border-radius:20px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font-family:var(--f-display);font-size:20px}

/* cart bar + nav */
.cartbar{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;pointer-events:none}
.cartbar .wrap{pointer-events:auto}
.cartbar button{width:100%;height:60px;border-radius:30px;background:var(--accent);color:#fff;border:0;display:flex;align-items:center;gap:12px;padding:0 8px 0 22px;box-shadow:0 10px 24px rgba(194,55,42,.32)}
.cartbar .l{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.cartbar .l span{font-size:12px;opacity:.88}
.cartbar .l b{font-size:17px}
.cartbar .r{margin-left:auto;height:44px;padding:0 20px;border-radius:22px;background:var(--surface);color:var(--accent);font-weight:800;display:flex;align-items:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:68px}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);position:relative}
nav.tabs button.on{color:var(--accent);font-weight:800}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}

/* sheet (product) */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(42,31,23,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;border-radius:28px 28px 0 0;overflow:auto;animation:up .22s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{animation:none}}
.sheet .hero{position:relative;aspect-ratio:4/3;max-width:100%}
.sheet .hero img{width:100%;height:100%;object-fit:cover;display:block}
.sheet .close{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:22px;background:var(--surface);border:0;display:flex;align-items:center;justify-content:center}
.sheet .ct{padding-block:18px 8px;display:flex;flex-direction:column;gap:14px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:800;padding:5px 10px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.pill.g{background:var(--ok-soft);color:var(--ok)}
.pill.n{background:#ECE3D6;color:#5E4630}
.sheet h2{font-family:var(--f-display);font-size:27px;line-height:1.15}
.desc{font-size:14px;line-height:1.5;color:var(--muted)}
.kbju{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-radius:18px;padding:12px 4px}
.kbju div{display:flex;flex-direction:column;align-items:center;gap:2px}
.kbju div+div{border-left:1px solid var(--line)}
.kbju b{font-size:16px}
.kbju span{font-size:11px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.facts div{border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.facts span{font-size:11px;color:var(--muted)}
.facts b{font-size:14px}
.buy{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-block:12px 14px;display:flex;gap:10px;align-items:center}
.stepper{display:flex;align-items:center;background:var(--bg);border-radius:28px;height:54px;flex-shrink:0}
.stepper button{width:46px;height:54px;border:0;background:transparent;font-size:22px}
.stepper .v{min-width:66px;display:flex;flex-direction:column;align-items:center}
.stepper .v b{font-size:16px}
.stepper .v span{font-size:11px;color:var(--muted)}
.buy .btn{flex:1;flex-direction:column;gap:0;line-height:1.15}
.buy .btn span{font-size:11.5px;font-weight:600;opacity:.9}

/* cart */
.block{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.date{height:62px;border-radius:18px;border:0;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.date b{font-size:15px}
.date span{font-size:11.5px;color:var(--muted)}
.date.on{background:var(--dark);color:var(--dark-ink)}
.date.on span{color:#D9CFC6}
.date[disabled]{opacity:.4}
.row{background:var(--surface);border-radius:18px;padding:10px;display:flex;gap:12px;align-items:center}
.row img{width:56px;height:56px;border-radius:14px;object-fit:cover;flex-shrink:0}
.row .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .mid b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid span{font-size:12px;color:var(--muted)}
.mini{display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:18px;flex-shrink:0}
.mini button{width:34px;height:36px;border:0;background:transparent;font-size:18px}
.mini b{min-width:22px;text-align:center;font-size:14px}
.point{background:var(--surface);border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.point .ic{width:40px;height:40px;border-radius:20px;background:var(--ok-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
textarea.input{height:auto;min-height:52px;padding:14px 18px;resize:none;border-radius:20px}
.total{background:var(--surface);border-radius:24px;padding:16px 18px;margin-top:16px;display:flex;flex-direction:column;gap:8px}
.total .tl{display:flex;justify-content:space-between;align-items:baseline}
.total .big{font-family:var(--f-display);font-size:26px;font-weight:800}

/* orders */
.order{background:var(--surface);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;border:0;text-align:left;width:100%}
.order .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.order .h b{font-size:15px}
.status{font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:10px;white-space:nowrap}
.s0{background:#ECE3D6;color:#5E4630}.s1{background:#FCEBD2;color:#8A4B0B}.s2{background:#E2ECF7;color:#1F4F86}.s3{background:#F7E1DD;color:#9E2A20}.s4{background:var(--ok-soft);color:var(--ok)}.sx{background:#EEE;color:#666}
.thumbs{display:flex;gap:6px}
.thumbs img{width:40px;height:40px;border-radius:10px;object-fit:cover}
.timeline{display:flex;flex-direction:column;gap:0;background:var(--surface);border-radius:20px;padding:14px 16px}
.tl-step{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}
.tl-step:last-child{padding-bottom:0}
.tl-step .dot{width:18px;height:18px;border-radius:9px;border:2px solid var(--line);background:var(--surface);flex-shrink:0;margin-top:1px;position:relative;z-index:1}
.tl-step.done .dot{background:var(--ok);border-color:var(--ok)}
.tl-step.cur .dot{background:var(--accent);border-color:var(--accent)}
.tl-step:not(:last-child)::before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl-step.done:not(:last-child)::before{background:var(--ok)}
.tl-step b{font-size:14px;display:block}
.tl-step span{font-size:12px;color:var(--muted)}
.demo-btn{border:1px dashed var(--gold);background:transparent;color:var(--gold);border-radius:14px;padding:10px 14px;font-weight:700;font-size:13px}

/* success */
.done-screen{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-block:48px 24px}
.done-screen .ok{width:88px;height:88px;border-radius:44px;background:var(--ok-soft);display:flex;align-items:center;justify-content:center}
.done-screen h1{font-family:var(--f-display);font-size:30px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--dark);color:var(--dark-ink);font-size:13.5px;font-weight:700;padding:10px 16px;border-radius:20px;box-shadow:0 8px 20px rgba(0,0,0,.2);white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;font-weight:700;color:var(--muted);padding:6px 0;min-height:44px}
</style>
</head>

<div id="splash" role="img" aria-label="Энергия — заказ продукции">
  <div class="sp-glow" aria-hidden="true"></div>
  <svg id="spSvg" viewBox="0 0 300 300" aria-hidden="true"></svg>
  <div class="sp-word" aria-hidden="true">Энергия</div>
  <div class="sp-rule" aria-hidden="true"></div>
</div>
<script>
(function(){
  var sp=document.getElementById('splash');if(!sp)return;
  var meta=document.querySelector('meta[name="theme-color"]');
  if(!meta){meta=document.createElement('meta');meta.name='theme-color';document.head.appendChild(meta)}

  var standalone=window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches;
  var seen=false;try{seen=!standalone&&sessionStorage.getItem('en-splash2')==='1'}catch(e){}
  var raf=0,left=false;
  function done(){cancelAnimationFrame(raf);if(sp.parentNode)sp.parentNode.removeChild(sp);meta.setAttribute('content',prev)}
  if(seen){done();return}
  try{sessionStorage.setItem('en-splash2','1')}catch(e){}
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var NS='http://www.w3.org/2000/svg',svg=document.getElementById('spSvg');
  function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
  /* smiling sun: a ring of six links, then eight rays; [x1,y1,x2,y2,width] in chain order */
  var P=[];(function(){var cx=150,cy=150,i,a,b;for(i=0;i<6;i++){a=(-90+i*60)*Math.PI/180;b=(-90+(i+1)*60)*Math.PI/180;P.push([cx+40*Math.cos(a),cy+40*Math.sin(a),cx+40*Math.cos(b),cy+40*Math.sin(b),26])}for(i=0;i<8;i++){a=(-90+i*45)*Math.PI/180;P.push([cx+60*Math.cos(a),cy+60*Math.sin(a),cx+88*Math.cos(a),cy+88*Math.sin(a),22])}})();
  var S=P.map(function(q){var dx=q[2]-q[0],dy=q[3]-q[1];return {cx:(q[0]+q[2])/2,cy:(q[1]+q[3])/2,a:Math.atan2(dy,dx)*180/Math.PI,len:Math.max(20,Math.hypot(dx,dy)-1),w:q[4]}});
  var defs=el('defs',{},svg),g=el('linearGradient',{id:'spG',x1:0,y1:0,x2:0,y2:1},defs);
  el('stop',{offset:0,'stop-color':'#F8C9B0'},g);el('stop',{offset:1,'stop-color':'#E08E70'},g);
  var shadow=el('ellipse',{cx:150,cy:268,rx:62,ry:7,fill:'#5A120C',opacity:0},svg);

function deliveryOptions(){
  var now=new Date(), first=now.getHours()<CUTOFF?1:2, out=[], i=first;
  while(out.length<3&&i<10){var d=addDays(now,i);if(d.getDay()!==0)out.push(d);i++}
  return out.map(function(d,k){var diff=Math.round((new Date(iso(d))-new Date(iso(now)))/864e5);return {iso:iso(d),label:diff===1?'Завтра':diff===2?'Послезавтра':DOW[d.getDay()].toUpperCase()==='СБ'?'Суббота':cap(DOW[d.getDay()]),sub:d.getDate()+' '+MON[d.getMonth()].slice(0,3),date:d}});
}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}

/* state */
var S={logged:false,who:'',cart:{},date:null,comment:'',orders:[],nextNum:1044,tab:'catalog',cat:'Всё',q:'',openOrder:null,justPlaced:null};
function seedOrders(){
  var now=new Date();
  return [
    {num:1038,date:iso(addDays(now,-2)),status:4,lines:[{id:'dok',q:2},{id:'kolb',q:4},{id:'ham',q:1}],comment:'',fact:true,factK:[0.98,1,1.02]},
    {num:1029,date:iso(addDays(now,-6)),status:4,lines:[{id:'dok',q:3},{id:'serv',q:4},{id:'kupaty',q:6}],comment:'позвонить за 30 минут',fact:true,factK:[1.01,1,0.99]}
  ];
}
function load(){try{var raw=localStorage.getItem('md-demo-v1');if(raw){var d=JSON.parse(raw);Object.assign(S,d)}}catch(e){}
  if(!S.orders||!S.orders.length)S.orders=seedOrders();}
function save(){try{localStorage.setItem('md-demo-v1',JSON.stringify({logged:S.logged,who:S.who,cart:S.cart,date:S.date,comment:S.comment,orders:S.orders,nextNum:S.nextNum}))}catch(e){}}

function cartItems(){return Object.keys(S.cart).filter(function(k){return S.cart[k]>0&&BY[k]}).map(function(k){return {p:BY[k],q:S.cart[k]}})}
function cartTotal(){return cartItems().reduce(function(s,i){return s+i.q*i.p.w*i.p.price},0)}
function cartCount(){return cartItems().length}
function setQty(id,q){q=Math.max(0,Math.min(99,q));if(q)S.cart[id]=q;else delete S.cart[id];save();refreshChrome()}

var $=function(id){return document.getElementById(id)};
var toastT;
function toast(msg){var t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},1800)}

function refreshChrome(){
  var n=cartCount(),b=$('badge');b.textContent=n;b.hidden=!n;
  var showBar=n>0&&(S.tab==='catalog'||S.tab==='repeat')&&!S.justPlaced;
  $('cartbar').hidden=!showBar;
  $('cbCount').textContent=n+' '+plural(n,'позиция','позиции','позиций');
  $('cbSum').textContent='≈ '+rub(cartTotal());
  document.querySelectorAll('nav.tabs button').forEach(function(btn){btn.classList.toggle('on',btn.dataset.tab===S.tab)});
}

/* ---------- views ---------- */
function header(title,sub){
  return '<div class="top"><div><div class="eyebrow">«Энергия»</div><h1>'+title+'</h1><div class="addr">'+(sub||'Магазин «Пример» · ул. Мира, 12')+'</div></div>'+
  '<button class="round" type="button" data-act="profile" aria-label="Профиль"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button></div>';
}
function cardHTML(p){
  var q=S.cart[p.id]||0;
  return '<div class="card"><button type="button" data-open="'+p.id+'" style="border:0;padding:0;background:transparent;text-align:left;display:block;width:100%">'+
   '<div class="ph"><img src="'+IMG[p.id]+'" alt="'+esc(p.full)+'" loading="lazy">'+(p.tag?'<span class="tag'+(p.tag==='Новинка'?' new':'')+'">'+p.tag+'</span>':'')+'</div></button>'+
   '<div class="bd"><button type="button" data-open="'+p.id+'" style="border:0;padding:0;background:transparent;text-align:left;min-width:0"><div class="nm">'+esc(p.name)+'</div><div class="pk">'+p.kind+' · '+p.unitFull+' ~'+kg(p.w)+' кг</div></button>'+
   '<div class="rw"><div class="price num">'+p.price+' ₽<small> /кг</small></div>'+
   (q?'<button type="button" class="incart" data-open="'+p.id+'">✓ '+q+' '+p.unit+'</button>':'<button type="button" class="add" data-add="'+p.id+'" aria-label="Добавить: '+esc(p.name)+'"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>')+
   '</div></div></div>';
}
function viewCatalog(){
  var opts=deliveryOptions(),first=opts[0];
  var list=P.filter(function(p){return (S.cat==='Всё'||p.cat===S.cat)&&(!S.q||(p.full+' '+p.kind).toLowerCase().indexOf(S.q.toLowerCase())>=0)});
  var h=header('Каталог');
  h+='<div class="delivery"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg><span>Ближайшая доставка: <b>'+first.label.toLowerCase()+', '+first.sub+'</b> · заказ до '+CUTOFF+':00</span></div>';
  h+='<label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B5B4E" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" type="search" placeholder="Колбаса, ветчина, купаты…" aria-label="Поиск по каталогу" value="'+esc(S.q)+'"></label>';
  h+='<div class="chips" role="tablist">'+CATS.map(function(c){return '<button type="button" class="chip'+(c===S.cat?' on':'')+'" data-cat="'+c+'">'+c+'</button>'}).join('')+'</div>';
  h+='<div class="sec-title"><h2>'+(S.cat==='Всё'?'Весь ассортимент':S.cat)+'</h2><span class="muted num" style="font-size:13px">'+list.length+' '+plural(list.length,'позиция','позиции','позиций')+'</span></div>';
  h+=list.length?'<div class="grid">'+list.map(cardHTML).join('')+'</div>':'<div class="empty"><h3>Ничего не нашлось</h3><p class="hint">Попробуйте другое слово или выберите категорию «Всё».</p></div>';
  h+='<p class="demo-note">Демо-версия для пилота: товары, цены и фото условные.</p>';

function viewRepeat(){
  var last=S.orders[0],h=header('Повторить');
  var freq={};S.orders.forEach(function(o){o.lines.forEach(function(l){freq[l.id]=(freq[l.id]||0)+1})});
  var ids=Object.keys(freq).sort(function(a,b){return freq[b]-freq[a]});
  if(last){
    h+='<div class="block"><div class="eyebrow">Последний заказ · № '+last.num+'</div>'+
     '<div class="order" style="cursor:default"><div class="thumbs">'+last.lines.map(function(l){return '<img src="'+IMG[l.id]+'" alt="">'}).join('')+'</div>'+
     '<div class="muted" style="font-size:13px">'+last.lines.map(function(l){return BY[l.id].name+' — '+l.q+' '+BY[l.id].unit}).join(' · ')+'</div>'+
     '<button type="button" class="btn" data-repeat="'+last.num+'">Повторить заказ целиком</button></div></div>';
  }
  h+='<div class="sec-title"><h2>Вы часто берёте</h2></div><div class="grid">'+ids.map(function(id){return cardHTML(BY[id])}).join('')+'</div>';
  return h;
}
function viewCart(){
  var items=cartItems(),opts=deliveryOptions();
  if(!S.date||!opts.some(function(o){return o.iso===S.date}))S.date=opts[0].iso;
  var h='<div class="top"><div><div class="eyebrow">«Энергия»</div><h1>Ваш заказ</h1></div></div>';
  if(!items.length){
    return h+'<div class="empty" style="margin-top:16px"><h3>Корзина пустая</h3><p class="hint">Добавьте товары из каталога или повторите прошлый заказ.</p><button type="button" class="btn" data-tab-go="catalog">В каталог</button><button type="button" class="btn ghost" data-tab-go="repeat">Повторить прошлый</button></div>';
  }
  var now=new Date();
  h+='<div class="block"><div class="eyebrow">Когда привезти</div><div class="dates">'+opts.map(function(o){return '<button type="button" class="date'+(o.iso===S.date?' on':'')+'" data-date="'+o.iso+'"><b>'+o.label+'</b><span>'+o.sub+'</span></button>'}).join('')+'</div>'+
   (now.getHours()>=CUTOFF?'<p class="hint">Приём на завтра закрыт в '+CUTOFF+':00 — ближайшая доставка послезавтра.</p>':'')+'</div>';
  h+='<div class="block"><div class="eyebrow">Куда</div><div class="point"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A6526" stroke-width="1.9" aria-hidden="true"><path d="M12 21s-6-5.5-6-11a6 6 0 0 1 12 0c0 5.5-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg></span><div style="display:flex;flex-direction:column;gap:2px"><b style="font-size:14px">ул. Мира, 12 — магазин</b><span class="muted" style="font-size:12px">приёмка 7:00–11:00</span></div></div></div>';
  h+='<div class="block"><div class="eyebrow">'+items.length+' '+plural(items.length,'позиция','позиции','позиций')+'</div>'+items.map(function(i){var s=i.q*i.p.w*i.p.price;return '<div class="row"><img src="'+IMG[i.p.id]+'" alt=""><div class="mid"><b>'+esc(i.p.name)+'</b><span class="num">'+i.q+' '+i.p.unit+' ≈ '+kg(i.q*i.p.w)+' кг · ≈ '+rub(s)+'</span></div><div class="mini"><button type="button" data-dec="'+i.p.id+'" aria-label="Меньше">−</button><b class="num">'+i.q+'</b><button type="button" data-inc="'+i.p.id+'" aria-label="Больше">+</button></div></div>'}).join('')+'</div>';
  h+='<div class="block"><label class="eyebrow" for="comment">Комментарий</label><textarea class="input" id="comment" rows="2" placeholder="Например: позвонить за 30 минут">'+esc(S.comment)+'</textarea></div>';
  h+='<div class="total"><div class="tl"><span class="muted">Итого, примерно</span><span class="big num">≈ '+rub(cartTotal())+'</span></div><span class="hint">Точную сумму покажем после взвешивания на складе.</span><button type="button" class="btn" data-act="place">Оформить на '+(function(){var o=opts.filter(function(x){return x.iso===S.date})[0];return o.label==='Завтра'||o.label==='Послезавтра'?o.label.toLowerCase():o.sub})()+'</button></div>';
  return h;
}
function orderSum(o){var exact=o.status>=2;return o.lines.reduce(function(s,l,i){var p=BY[l.id];var k=exact&&o.factK?o.factK[i]||1:1;return s+l.q*p.w*k*p.price},0)}
function viewOrders(){
  if(S.openOrder)return viewOrder(S.openOrder);
  var h=header('Заказы');
  h+='<div class="block">'+S.orders.map(function(o){var d=new Date(o.date);var st=o.cancel?'<span class="status sx">Отменён</span>':'<span class="status s'+o.status+'">'+STATUSES[o.status]+'</span>';
   return '<button type="button" class="order" data-order="'+o.num+'"><div class="h"><b>№ '+o.num+' · '+dayStr(d)+'</b>'+st+'</div><div class="thumbs">'+o.lines.map(function(l){return '<img src="'+IMG[l.id]+'" alt="">'}).join('')+'</div><div class="h"><span class="muted" style="font-size:13px">'+o.lines.length+' '+plural(o.lines.length,'позиция','позиции','позиций')+'</span><b class="num">'+(o.status>=2?'':'≈ ')+rub(orderSum(o))+'</b></div></button>'}).join('')+'</div>';
  return h;
}
function viewOrder(num){
  var o=S.orders.filter(function(x){return x.num===num})[0];if(!o){S.openOrder=null;return viewOrders()}
  var d=new Date(o.date),exact=o.status>=2;
  var h='<button type="button" class="back" data-act="backOrders"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Все заказы</button>';
  h+='<div class="top" style="padding-top:0"><div><div class="eyebrow">Доставка '+dayStr(d)+'</div><h1>Заказ № '+o.num+'</h1></div></div>';
  if(o.cancel){h+='<div class="empty"><h3>Заказ отменён</h3></div>'}
  else{
  h+='<div class="timeline">'+STATUSES.map(function(s,i){var c=i<o.status?'done':i===o.status?(o.status===4?'done':'cur'):'';return '<div class="tl-step '+c+'"><span class="dot"></span><div><b>'+s+'</b>'+(i===o.status?'<span>'+STATUS_HINT[i]+'</span>':'')+'</div></div>'}).join('')+'</div>';
  }
  h+='<div class="block"><div class="eyebrow">Состав</div>'+o.lines.map(function(l,i){var p=BY[l.id];var fk=exact&&o.factK?o.factK[i]||1:1;var w=l.q*p.w*fk;return '<div class="row"><img src="'+IMG[p.id]+'" alt=""><div class="mid"><b>'+esc(p.name)+'</b><span class="num">'+l.q+' '+p.unit+' · '+(exact?'факт '+kg(w)+' кг':'≈ '+kg(w)+' кг')+'</span></div><b class="num" style="font-size:14px;white-space:nowrap">'+(exact?'':'≈ ')+rub(w*p.price)+'</b></div>'}).join('')+'</div>';
  if(o.comment)h+='<p class="hint" style="margin-top:12px"><b>Комментарий:</b> '+esc(o.comment)+'</p>';
  h+='<div class="total"><div class="tl"><span class="muted">'+(exact?'Сумма по весу':'Итого, примерно')+'</span><span class="big num">'+(exact?'':'≈ ')+rub(orderSum(o))+'</span></div>';
  h+='<button type="button" class="btn dark" data-repeat="'+o.num+'">Повторить этот заказ</button>';
  if(!o.cancel&&o.status===0)h+='<button type="button" class="btn ghost" data-cancel="'+o.num+'">Отменить заказ</button>';
  h+='</div>';
  if(!o.cancel&&o.status<4)h+='<div class="block"><button type="button" class="demo-btn" data-advance="'+o.num+'">Демо: перевести в «'+STATUSES[o.status+1]+'»</button><p class="hint">В рабочей версии статусы меняют склад и водитель.</p></div>';
  return h;
}
function viewDone(){
  var o=S.orders.filter(function(x){return x.num===S.justPlaced})[0];var d=new Date(o.date);
  return '<div class="done-screen"><div class="ok"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#2A6526" stroke-width="2.4" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><div class="eyebrow">Заказ № '+o.num+'</div><h1>Заказ принят</h1><p class="hint" style="max-width:300px">Привезём '+dayStr(d)+' на ул. Мира, 12. До '+CUTOFF+':00 накануне заказ можно изменить или отменить.</p><p class="num" style="font-size:15px">≈ '+rub(orderSum(o))+' · точная сумма после взвешивания</p></div>'+
   '<div style="display:flex;flex-direction:column;gap:10px"><button type="button" class="btn" data-act="seeOrder">Смотреть заказ</button><button type="button" class="btn ghost" data-act="doneCatalog">Вернуться в каталог</button></div>';
}

function render(){
  if(!S.logged){$('login').hidden=false;$('shell').hidden=true;$('tabs').hidden=true;$('cartbar').hidden=true;return}
  $('login').hidden=true;$('shell').hidden=false;$('tabs').hidden=false;
  var v=$('view');
  if(S.justPlaced)v.innerHTML=viewDone();
  else if(S.tab==='catalog')v.innerHTML=viewCatalog();
  else if(S.tab==='repeat')v.innerHTML=viewRepeat();
  else if(S.tab==='cart')v.innerHTML=viewCart();
  else v.innerHTML=viewOrders();
  refreshChrome();
}
function go(tab){S.tab=tab;S.openOrder=null;S.justPlaced=null;render();window.scrollTo(0,0)}

/* ---------- product sheet ---------- */
var sheetQty=1;
function openProduct(id){
  var p=BY[id];sheetQty=S.cart[id]||1;
  var ov=$('overlay');
  function draw(){
    var w=sheetQty*p.w;
    ov.innerHTML='<div class="scrim" data-act="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="'+esc(p.full)+'">'+
     '<div class="hero"><img src="'+IMG[p.id]+'" alt="'+esc(p.full)+'"><button type="button" class="close" data-act="closeSheet" aria-label="Закрыть"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2A1F17" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'+
     '<div class="ct wrap"><div class="pills">'+(p.tag?'<span class="pill'+(p.tag==='Новинка'?' g':'')+'">'+p.tag+'</span>':'')+'<span class="pill g">Есть на ближайшую доставку</span><span class="pill n">'+p.cat+'</span></div>'+
     '<h2>'+esc(p.full)+'</h2><p class="desc">'+p.desc+'</p>'+
     '<div style="display:flex;align-items:baseline;gap:8px"><span class="price num" style="font-size:30px">'+p.price+' ₽</span><span class="muted">за кг · ваша цена</span></div>'+
     '<div class="kbju"><div><b>'+p.kb[3]+'</b><span>ккал</span></div><div><b>'+p.kb[0]+' г</b><span>белки</span></div><div><b>'+p.kb[1]+' г</b><span>жиры</span></div><div><b>'+String(p.kb[2]).replace('.',',')+' г</b><span>углев.</span></div></div>'+
     '<div class="facts"><div><span>Срок</span><b>'+p.shelf+'</b></div><div><span>Хранение</span><b>'+p.store+'</b></div><div><span>Фасовка</span><b>~'+kg(p.w)+' кг</b></div></div>'+
     '<div><b class="serif" style="font-size:17px">Состав</b><p class="desc" style="margin:4px 0 0">'+cap(p.comp)+'.</p></div></div>'+
     '<div class="buy wrap"><div class="stepper"><button type="button" data-sq="-1" aria-label="Меньше">−</button><div class="v"><b class="num">'+sheetQty+' '+p.unit+'</b><span class="num">≈ '+kg(w)+' кг</span></div><button type="button" data-sq="1" aria-label="Больше">+</button></div>'+
     '<button type="button" class="btn" data-act="sheetAdd">'+(S.cart[id]?'Обновить корзину':'В корзину')+'<span class="num">≈ '+rub(w*p.price)+'</span></button></div>'+
     '</div></div>';
  }
  draw();
  ov.onclick=function(e){
    var t=e.target.closest('[data-sq],[data-act]');if(!t)return;
    if(t.dataset.sq){e.stopPropagation();sheetQty=Math.max(1,Math.min(99,sheetQty+Number(t.dataset.sq)));draw();return}
    var a=t.dataset.act;
    if(a==='closeSheet'){if(t.classList.contains('scrim')&&e.target!==t)return;closeSheet()}
    if(a==='sheetAdd'){setQty(id,sheetQty);toast(p.name+': '+sheetQty+' '+p.unit+' в корзине');closeSheet();render()}
  };
  document.addEventListener('keydown',escClose);
}
function escClose(e){if(e.key==='Escape')closeSheet()}
function closeSheet(){$('overlay').innerHTML='';document.removeEventListener('keydown',escClose)}

/* ---------- events ---------- */
$('loginForm').addEventListener('submit',function(e){e.preventDefault();var k=$('key').value.trim();if(k.length<4){$('loginErr').hidden=false;return}S.logged=true;S.who=$('who').value.trim();save();render();toast('Добро пожаловать'+(S.who?', '+S.who:''))});
document.querySelectorAll('nav.tabs button').forEach(function(b){b.addEventListener('click',function(){go(b.dataset.tab)})});
$('cartbarBtn').addEventListener('click',function(){go('cart')});
$('view').addEventListener('click',function(e){
  var t=e.target.closest('button');if(!t)return;var ds=t.dataset;
  if(ds.open){openProduct(ds.open);return}
  if(ds.add){var p=BY[ds.add];setQty(ds.add,1);toast(p.name+': 1 '+p.unit+' в корзине');render();return}
  if(ds.cat){S.cat=ds.cat;render();return}
  if(ds.tabGo){go(ds.tabGo);return}
  if(ds.date){S.date=ds.date;save();render();return}
  if(ds.inc){setQty(ds.inc,(S.cart[ds.inc]||0)+1);render();return}
  if(ds.dec){setQty(ds.dec,(S.cart[ds.dec]||0)-1);render();return}
  if(ds.order){S.openOrder=Number(ds.order);render();window.scrollTo(0,0);return}
  if(ds.repeat){var o=S.orders.filter(function(x){return x.num===Number(ds.repeat)})[0];o.lines.forEach(function(l){S.cart[l.id]=l.q});save();toast('Товары из заказа № '+o.num+' в корзине');go('cart');return}
  if(ds.cancel){var oc=S.orders.filter(function(x){return x.num===Number(ds.cancel)})[0];oc.cancel=true;save();toast('Заказ № '+oc.num+' отменён');render();return}
  if(ds.advance){var oa=S.orders.filter(function(x){return x.num===Number(ds.advance)})[0];oa.status=Math.min(4,oa.status+1);if(oa.status===2&&!oa.factK)oa.factK=oa.lines.map(function(){return 0.96+Math.random()*0.07});save();toast('Статус: '+STATUSES[oa.status]);render();return}
  var a=ds.act;
  if(a==='profile'){toast('Магазин «Пример» · '+(S.who||'сотрудник'))}
  if(a==='backOrders'){S.openOrder=null;render()}
  if(a==='place'){var items=cartItems();var o2={num:S.nextNum++,date:S.date,status:0,lines:items.map(function(i){return {id:i.p.id,q:i.q}}),comment:S.comment};S.orders.unshift(o2);S.cart={};S.comment='';S.justPlaced=o2.num;save();render();window.scrollTo(0,0)}
  if(a==='seeOrder'){var n=S.justPlaced;S.justPlaced=null;S.tab='orders';S.openOrder=n;render();window.scrollTo(0,0)}
  if(a==='doneCatalog'){go('catalog')}
});
$('view').addEventListener('input',function(e){
  if(e.target.id==='q'){S.q=e.target.value;var pos=e.target.selectionStart;render();var q=$('q');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}
  if(e.target.id==='comment'){S.comment=e.target.value;save()}
});

load();render();
})();
</script>
