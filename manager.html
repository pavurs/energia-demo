<style>
/* Layout: one phone column (max 560px), sticky top context bar, bottom tabs; sheets slide up for product options and forms */
:root{
  --bg:#E8E7E4; --surface:#F4F4F3; --card:#FFFFFF; --ink:#1E1C1A; --muted:#5F5954; --line:#DAD7D2;
  --maroon:#833B36; --maroon-ink:#F1EAE2; --maroon-soft:#F1DEDA; --cream:#F1EAE2;
  --forest:#2F4A3A; --forest-ink:#EEF2EC; --dark:#2B2826; --dark-ink:#F4F1EC; --ok:#2F6B3A; --ok-soft:#DCEBDD; --warn:#8A4B0B; --warn-soft:#FBEBD3;
  --f-display:'Forum', Georgia, serif; --f-mono:'IBM Plex Mono','Courier New',monospace; --f-body:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;font-synthesis:none;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--forest)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--maroon);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--maroon)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0}

/* gate */
#gate{min-height:100vh;background:var(--cream);display:flex;align-items:center}
.gate{display:flex;flex-direction:column;gap:14px;padding-block:40px;width:100%}
.gate .eb{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--maroon)}
.gate .eb span{flex:1;height:2px;background:var(--ink)}
.plate{align-self:center;background:var(--maroon);color:var(--cream);font-family:var(--f-display);font-size:40px;letter-spacing:1px;line-height:1;padding:14px 28px 12px;border-radius:22px}
.gate p{text-align:center}
label.f{display:flex;flex-direction:column;gap:6px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--maroon)}
label.f small{font-family:var(--f-body);letter-spacing:0;text-transform:none;color:var(--muted);font-weight:500;font-size:12px}
.in{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-family:var(--f-body);font-size:15.5px;letter-spacing:normal;text-transform:none;color:var(--ink);width:100%;min-width:0}
textarea.in{height:auto;min-height:76px;padding:12px 14px;resize:vertical}
.in.code{letter-spacing:2px;font-weight:700;text-transform:uppercase}
.err{color:var(--maroon);font-weight:700;font-size:13px}
.btn{height:50px;border-radius:25px;border:1px solid var(--line);background:var(--card);font-weight:800;font-size:15px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn.main{background:var(--maroon);border-color:var(--maroon);color:var(--maroon-ink);box-shadow:0 8px 18px rgba(131,59,54,.25)}
.btn.dark{background:var(--dark);border-color:var(--dark);color:var(--dark-ink)}
.btn.sm{height:38px;font-size:13.5px;padding:0 14px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;box-shadow:none;cursor:default}

/* top bar */
header.top{background:var(--forest);color:var(--forest-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.mark{background:var(--maroon);color:var(--cream);font-family:var(--f-display);font-size:17px;line-height:1;padding:6px 10px 5px;border-radius:9px}
header.top .who{font-family:var(--f-mono);font-size:10.5px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;color:#C9D4CB}
header.top .who b{display:block;font-family:var(--f-body);letter-spacing:0;text-transform:none;font-size:13px;color:#fff}
main{padding-block:16px calc(150px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
h1.t{font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1.05}
.card{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:700;white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--dark);border-color:var(--dark);color:var(--dark-ink)}
.chip small{font-weight:600;opacity:.75;margin-left:4px}
.pick{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--card);border-radius:18px;padding:12px 14px;text-align:left}
.pick .ic{width:42px;height:42px;border-radius:21px;background:var(--maroon-soft);color:var(--maroon);display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0}
.pick b{display:block;font-size:15px}
.pick span{font-size:12.5px;color:var(--muted)}
.cat-badge{font-family:var(--f-mono);font-size:10.5px;font-weight:700;letter-spacing:.8px;padding:3px 8px;border-radius:8px;background:var(--surface);color:var(--ink);white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;height:46px;border-radius:23px;background:var(--card);border:1px solid var(--line);padding:0 16px}
.search input{border:0;outline:none;background:transparent;flex:1;min-width:0;font-size:15px}
.plist{display:flex;flex-direction:column;gap:8px}
.prod{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:8px 10px 8px 8px;border:0;width:100%;text-align:left}
.prod img{width:58px;height:58px;border-radius:12px;object-fit:cover;background:var(--surface);flex-shrink:0}
.prod .mid{flex:1;min-width:0}
.prod .mid b{display:block;font-family:var(--f-mono);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.2px;line-height:1.3}
.prod .mid span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.prod .pr{text-align:right;flex-shrink:0}
.prod .pr b{font-family:var(--f-display);font-weight:400;font-size:19px;display:block;white-space:nowrap}
.prod .pr span{font-size:11px;color:var(--muted)}
.prod .q{min-width:32px;height:32px;border-radius:16px;background:var(--ok-soft);color:var(--ok);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 8px}
.prod .add{width:36px;height:36px;border-radius:18px;background:var(--maroon);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;flex-shrink:0}
.cartbar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:31;pointer-events:none}
.cartbar .wrap{pointer-events:auto}
.cartbar button{width:100%;height:58px;border-radius:29px;border:0;background:var(--maroon);color:var(--maroon-ink);display:flex;align-items:center;gap:12px;padding:0 8px 0 20px;box-shadow:0 10px 22px rgba(131,59,54,.3)}
.cartbar .l{display:flex;flex-direction:column;align-items:flex-start;line-height:1.15}
.cartbar .l span{font-size:12px;opacity:.85}.cartbar .l b{font-size:16.5px}
.cartbar .r{margin-left:auto;height:42px;padding:0 18px;border-radius:21px;background:var(--cream);color:var(--maroon);font-weight:800;display:flex;align-items:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:32;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:66px}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
nav.tabs button.on{color:var(--maroon);font-weight:800}
.line{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid #EFEDEA}
.line:first-child{border-top:0;padding-top:0}
.line img{width:48px;height:48px;border-radius:10px;object-fit:cover;flex-shrink:0}
.line .mid{flex:1;min-width:0}
.line .mid b{display:block;font-size:14px}
.line .mid span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.line .opt{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.line .opt i{font-style:normal;font-size:11px;font-weight:700;background:var(--surface);border-radius:7px;padding:2px 7px}
.step{display:flex;align-items:center;background:var(--surface);border-radius:18px;flex-shrink:0}
.step button{width:36px;height:38px;border:0;background:transparent;font-size:18px}
.step b{min-width:26px;text-align:center;font-size:14px}
.totals{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.totals b{font-family:var(--f-display);font-weight:400;font-size:30px}
.dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.date{height:58px;border-radius:16px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.date b{font-size:14.5px}.date span{font-size:11.5px;color:var(--muted)}
.date.on{background:var(--dark);border-color:var(--dark);color:var(--dark-ink)}.date.on span{color:#CFC8C0}
.st{display:inline-block;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:9px;white-space:nowrap}
.s0{background:#ECE6DE;color:#5E4630}.s1{background:var(--warn-soft);color:var(--warn)}.s4{background:var(--ok-soft);color:var(--ok)}
.keybox{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:12px 14px}
.keybox code{flex:1;font-family:var(--f-mono);font-size:16px;font-weight:700;letter-spacing:1.5px;word-break:break-all}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.opt-b{min-height:42px;padding:8px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;text-align:left}
.opt-b.on{border:2px solid var(--maroon);background:var(--maroon-soft);color:var(--maroon);padding:7px 13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv span{color:var(--muted)}
.empty{background:var(--card);border-radius:18px;padding:24px 18px;text-align:center;color:var(--muted)}
.prices{width:100%;border-collapse:collapse;font-size:13.5px}
.prices td{padding:8px 0;border-top:1px solid #EFEDEA}
.prices td.r{text-align:right;white-space:nowrap}
.prices tr:first-child td{border-top:0}

/* sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(30,28,26,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:94%;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet .hd{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1.1}
.x{width:40px;height:40px;border-radius:20px;border:0;background:var(--card);font-size:17px;flex-shrink:0}
.ph{display:flex;gap:12px;align-items:center}
.ph img{width:84px;height:84px;border-radius:14px;object-fit:cover;flex-shrink:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid2 .full{grid-column:1/-1}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:var(--dark-ink);padding:10px 16px;border-radius:16px;font-weight:700;font-size:13.5px;z-index:70;max-width:calc(100% - 32px);text-align:center}
.demo{font-size:11.5px;color:var(--muted);text-align:center}
</style>
</head>
<body>


<div id="gate"><form class="gate wrap" id="gateForm" novalidate>
  <div class="eb"><span></span>Приложение менеджера<span></span></div>
  <div class="plate">ФЕРМЕРОФФ</div>
  <p class="hint">Заявки клиентов, карты клиентов, ценовые категории и ключи доступа. Войдите по ключу менеджера.</p>
  <label class="f" for="mkey">Ключ менеджера<input class="in code" id="mkey" autocomplete="off" autocapitalize="characters" placeholder="MGR-XXXX-XXXX-XXXX"></label>
  <label class="f" for="mname">Ваше имя<input class="in" id="mname" autocomplete="name" placeholder="Например, Ольга"></label>
  <div class="err" id="gerr" hidden></div>
  <button class="btn main wide" type="submit">Войти</button>
</form></div>

<div id="app" hidden>
  <header class="top"><div class="wrap"><div class="mark">ФЕРМЕРОФФ</div><div class="who">Менеджер<b id="who">—</b></div></div></header>
  <main class="wrap" id="view"></main>
</div>
<div class="cartbar" id="cartbar" hidden><div class="wrap"><button type="button" data-tab="cart"><div class="l"><span id="cbN">0 позиций</span><b class="num" id="cbS">0 ₽</b></div><span class="r">Корзина</span></button></div></div>

  <button type="button" data-tab="clients"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.6 3.6-5.5 6.5-5.5s5.5 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.6.8 2.6 2.5 3 5.2"/></svg>Клиенты</button>
  <button type="button" data-tab="prices"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>Цены</button>
</div></nav>
<div id="overlay"></div>

function plural(n,a,b,c){n=Math.abs(n)%100;var m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m==1)return a;return c}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function dateOf(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function dayLabel(s){var d=dateOf(s);return DOW[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]}
var toastT;function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2300)}
function newKey(){var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',u=new Uint32Array(12),s='';crypto.getRandomValues(u);for(var i=0;i<12;i++){s+=a[u[i]%a.length];if(i===3||i===7)s+='-'}return 'FRM-'+s}
function copy(text,msg){if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(function(){toast(msg)},function(){toast('Не удалось скопировать — выделите текст вручную')});else toast('Копирование недоступно')}
function deliveryDates(){var now=new Date(),i=now.getHours()<CUTOFF?1:2,out=[];while(out.length<4&&i<12){var d=addDays(now,i);if(d.getDay()!==0)out.push(iso(d));i++}return out}

/* ---------- prices ---------- */
function b64u8(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function unlock(key){
  if(!(window.crypto&&crypto.subtle))return Promise.reject(new Error('nocrypto'));
  return crypto.subtle.importKey('raw',new TextEncoder().encode(String(key).trim().toUpperCase()),'PBKDF2',false,['deriveKey']).then(function(base){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64u8(PRICE_BOX.s),iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])
  }).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(PRICE_BOX.i)},k,b64u8(PRICE_BOX.c))
  }).then(function(buf){var m=JSON.parse(new TextDecoder().decode(buf));P.forEach(function(p){var v=m[p.id];if(v){p.pp=v[0];p.pkg=v[1];p.ppx=!!v[2]}})});
}
function catOf(c){for(var i=0;i<S.cats.length;i++)if(S.cats[i].id===(c&&c.cat))return S.cats[i];return S.cats[0]}
function pct(cat,p){var o=cat.over&&cat.over[p.cat];return (o!=null&&o!==''?+o:+cat.pct)||0}
/* price for one unit of a product for a client's category, honouring the chosen pack weight */
function unitPrice(p,cat,w){if(!p.pp)return 0;var k=1+pct(cat,p)/100;w=w||p.w;
  if(p.ppx&&Math.abs(w-p.w)<1e-6)return Math.round(p.pp*k);
  var perKg=p.pkg||(p.pp/p.w);return Math.round(perKg*w*k)}
function kgPrice(p,cat){var perKg=p.pkg||(p.pp?p.pp/p.w:0);return perKg?Math.round(perKg*(1+pct(cat,p)/100)):0}

/* ---------- product characteristics ---------- */
function packs(p){var m=String(p.pk).match(/[\d,]+\s*(?:кг|г)/g)||[];return m.map(function(x){var v=parseFloat(x.replace(',','.'));return {t:x.replace(/\s+/,' '),w:/кг/.test(x)?v:v/1000}})}
function optionsFor(p){
  var o=[],c=p.cat,n=p.name;
  if(c==='Сосиски')o.push({k:'len',t:'Длина',v:['Стандартная','Под хот-дог 16 см','Под хот-дог 20 см']});
  if(c==='Сосиски'||c==='Сардельки')o.push({k:'pack',t:'Упаковка',v:['Вакуум','МГС (газ)','Весовые']});
  if(c==='Вареные колбасы'||c==='Ветчина'||c==='Копчёные колбасы'||c==='Сырокопчёные'){o.push({k:'form',t:'Вид',v:['Целым батоном','Половинками','Нарезка в/у']});o.push({k:'pack',t:'Упаковка',v:['Без вакуума','В вакууме']})}
  if(c==='Свинина в/к'||c==='Птица в/к'){o.push({k:'form',t:'Вид',v:['Целым изделием','Порционная нарезка в/у']});o.push({k:'pack',t:'Упаковка',v:['В вакууме','В пергаменте']})}
  if(c==='Снеки'){var ps=packs(p);if(ps.length>1)o.push({k:'size',t:'Фасовка',v:ps.map(function(x){return x.t}),w:ps.map(function(x){return x.w})})}
  if(c==='Для жарки')o.push({k:'pack',t:'Упаковка',v:['Вакуум','Весовые']});
  return o;
}
function lineW(l){var p=BY[l.id],o=optionsFor(p).filter(function(x){return x.k==='size'})[0];if(o&&l.opt.size){var i=o.v.indexOf(l.opt.size);if(i>=0)return o.w[i]}return p.w}
function optText(l){var p=BY[l.id];return optionsFor(p).map(function(o){return l.opt[o.k]}).filter(Boolean).concat(l.note?['«'+l.note+'»']:[])}

 ['name','Название точки','Магазин «…»',1],['legal','Юрлицо / ИП','ООО «…» или ИП Фамилия',0],['inn','ИНН','',0],
 ['type','Тип клиента','',0,['магазин','сеть','кафе','ресторан','столовая','школа / сад','другое']],
 ['addr','Адрес доставки','ул. …, дом',1],['win','Окно приёмки','8:00–11:00',0],['days','Дни доставки','пн–сб',0],
 ['contact','Контактное лицо','Имя',1],['phone','Телефон','+7 …',1],
 ['volume','Объём в неделю, кг','примерно',0],['pay','Оплата','',0,['предоплата','по факту','отсрочка 7 дней','отсрочка 14 дней','отсрочка 30 дней']],
 ['docs','Документы','',0,['ЭДО','бумажные','ЭДО + бумажные']],['hotdog','Берут под хот-доги?','',0,['','да','нет']],
 ['notes','Особенности','длина сосисок, нарезка, упаковка, въезд, кто принимает…',0]
];
function clientSheet(){
  var x=SH.data,isNew=!SH.id,h='<div class="hd"><div><div class="eyebrow">'+(isNew?'Опросный лист':'Карта клиента')+'</div><h2>'+(isNew?'Новый клиент':esc(x.name))+'</h2></div><button class="x" data-close="1" aria-label="Закрыть">✕</button></div>';
  h+='<div class="card grid2">'+QFIELDS.map(function(f){var full=['name','legal','addr','notes'].indexOf(f[0])>=0?' full':'',val=x[f[0]]||'';
    if(f[4])return '<label class="f'+full+'">'+f[1]+'<select class="in" data-q="'+f[0]+'">'+f[4].map(function(o){return '<option'+(o===val?' selected':'')+' value="'+esc(o)+'">'+(o||'—')+'</option>'}).join('')+'</select></label>';
    if(f[0]==='notes')return '<label class="f full">'+f[1]+'<textarea class="in" data-q="notes" placeholder="'+esc(f[2])+'">'+esc(val)+'</textarea></label>';
    return '<label class="f'+full+'">'+f[1]+(f[3]?' *':'')+'<input class="in" data-q="'+f[0]+'" value="'+esc(val)+'" placeholder="'+esc(f[2])+'"'+(f[0]==='phone'?' inputmode="tel"':f[0]==='inn'||f[0]==='volume'?' inputmode="numeric"':'')+'></label>'}).join('')+'</div>';
  h+='<div class="eyebrow">Категория цен</div><div class="seg">'+S.cats.map(function(ct){return '<button class="opt-b'+(x.cat===ct.id?' on':'')+'" data-setcat="'+ct.id+'">'+esc(ct.name)+' <span class="hint" style="display:inline">'+(ct.pct>0?'+':'')+ct.pct+'%</span></button>'}).join('')+'</div>';
  h+='<div class="eyebrow">Ключ доступа к приложению</div>'+(x.key?'<div class="keybox"><code>'+esc(x.key)+'</code><button class="btn sm" data-act="copyKey">Копировать</button></div><div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="shareKey">Текст для клиента</button><button class="btn sm" data-act="newKey">Выдать новый</button></div><p class="hint">Ключ привязан к категории «'+esc(catOf(x).name)+'»: по нему клиент увидит свои цены. Новый ключ отменяет старый.</p>':'<button class="btn dark wide" data-act="newKey">Сгенерировать ключ</button><p class="hint">Ключ передаётся клиенту, по нему он входит в приложение и видит цены своей категории.</p>');
  h+='<div class="err" id="cerr" hidden></div><button class="btn main wide" data-act="saveClient">'+(isNew?'Сохранить клиента':'Сохранить изменения')+'</button>';
  if(!isNew)h+='<button class="btn wide" data-act="orderFor">Новая заявка для клиента</button>';
  return h;
}
function catSheet(){
  var ct=SH.data,isNew=!SH.id,sample=['Докторская колбаса','Сосиски Молочные','Балычок Бонито в/к','Ушки классические','Пельмени Элитные','Колбаски Мюнхенские'].map(function(n){return P.filter(function(p){return p.name===n})[0]}).filter(Boolean);
  var groups=CATS.slice(1);
  var h='<div class="hd"><div><div class="eyebrow">Ценовая категория</div><h2>'+(isNew?'Новая категория':esc(ct.name))+'</h2></div><button class="x" data-close="1" aria-label="Закрыть">✕</button></div>';
  h+='<div class="card grid2"><label class="f full">Название *<input class="in" data-c="name" value="'+esc(ct.name)+'" placeholder="Например, Опт крупный"></label><label class="f">Скидка / наценка, %<small>−5 = скидка 5%</small><input class="in" data-c="pct" inputmode="decimal" value="'+esc(ct.pct)+'"></label><label class="f">Для кого<input class="in" data-c="note" value="'+esc(ct.note||'')+'" placeholder="условия"></label></div>';
  h+='<div class="eyebrow">Свой процент для групп товаров</div><div class="card grid2">'+groups.map(function(g){var v=ct.over&&ct.over[g]!=null?ct.over[g]:'';return '<label class="f" style="font-size:10px">'+esc(g)+'<input class="in" data-ov="'+esc(g)+'" inputmode="decimal" value="'+esc(v)+'" placeholder="как общий"></label>'}).join('')+'</div>';
  h+='<div class="eyebrow">Как выйдут цены</div><div class="card"><table class="prices"><tbody>'+sample.map(function(p){var b=unitPrice(p,{pct:0,over:{}}),n=unitPrice(p,ct);return '<tr><td>'+esc(p.name)+'<div class="hint">'+esc(p.pk)+'</div></td><td class="r num"><span class="hint">'+rub(b)+'</span><br><b>'+rub(n)+'</b></td></tr>'}).join('')+'</tbody></table></div>';
  h+='<div class="err" id="cterr" hidden></div><button class="btn main wide" data-act="saveCat">Сохранить категорию</button>';
  return h;
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.scrim){closeSheet();return}
  var b=t.closest('button');if(!b)return;var d=b.dataset;
  if(d.tab){if(d.tab==='cart'&&!M.client)d.tab='order';go(d.tab);return}
  if(d.close){closeSheet();return}
  if(d.client){M.client=d.client;M.cart=[];M.comment='';render();window.scrollTo(0,0);return}
  if(d.date){M.date=d.date;render();return}
  if(d.cat!=null&&!d.cated){M.cat=d.cat;render();return}
  if(d.prod){var p=BY[d.prod],def={};optionsFor(p).forEach(function(o){def[o.k]=o.v[0]});SH={type:'prod',id:p.id,q:1,opt:def,note:''};sheet(productSheet());return}
  if(d.edit!=null){var l=M.cart[+d.edit];SH={type:'prod',id:l.id,q:l.q,opt:Object.assign({},l.opt),note:l.note,edit:+d.edit};sheet(productSheet());return}
  if(d.opt&&SH){SH.opt[d.opt]=d.val;sheet(productSheet());return}
  if(d.sq&&SH){SH.q=Math.max(1,Math.min(999,SH.q+(+d.sq)));sheet(productSheet());return}
  if(d.inc!=null){M.cart[+d.inc].q++;render();return}
  if(d.dec!=null){var li=M.cart[+d.dec];li.q--;if(li.q<1)M.cart.splice(+d.dec,1);render();return}
  if(d.card){var x=client(d.card);SH={type:'client',id:x.id,data:Object.assign({},x)};sheet(clientSheet());return}
  if(d.setcat&&SH){collectClient();SH.data.cat=d.setcat;sheet(clientSheet());return}
  if(d.cated){var ct=S.cats.filter(function(c){return c.id===d.cated})[0];SH={type:'cat',id:ct.id,data:JSON.parse(JSON.stringify(ct))};sheet(catSheet());return}
  if(d.copyo){var o=S.orders.filter(function(x){return x.num===+d.copyo})[0],c=client(o.client);copy('Заявка № '+o.num+' · '+c.name+' · '+dayLabel(o.date)+'\n'+o.lines.map(function(l){var p=BY[l.id],ot=optText(l);return '• '+p.name+' — '+l.q+' '+p.unit+(ot.length?' ('+ot.join(', ')+')':'')}).join('\n')+(o.comment?'\nКомментарий: '+o.comment:''),'Заявка скопирована');return}
  if(d.repeato){var o2=S.orders.filter(function(x){return x.num===+d.repeato})[0];M.client=o2.client;M.cart=JSON.parse(JSON.stringify(o2.lines));M.comment=o2.comment||'';go('cart');toast('Состав заявки № '+o2.num+' в корзине');return}
  var a=d.act;if(!a)return;
  if(a==='changeClient'){if(M.cart.length&&!M.confirmChange){M.confirmChange=true;toast('Корзина очистится. Нажмите ещё раз, чтобы сменить клиента');setTimeout(function(){M.confirmChange=false},3000);return}M.client=null;M.cart=[];M.confirmChange=false;render()}
  if(a==='repeat'){var last=S.orders.filter(function(o){return o.client===M.client}).sort(function(x,y){return y.num-x.num})[0];if(last){M.cart=JSON.parse(JSON.stringify(last.lines));go('cart');toast('Прошлая заявка в корзине')}}
  if(a==='addLine'&&SH){SH.note=($('lnote')||{}).value||'';var line={id:SH.id,q:SH.q,opt:SH.opt,note:SH.note.trim()};
    if(SH.edit!=null)M.cart[SH.edit]=line;else{var same=M.cart.filter(function(x){return x.id===line.id&&JSON.stringify(x.opt)===JSON.stringify(line.opt)&&x.note===line.note})[0];if(same)same.q+=line.q;else M.cart.push(line)}
    var nm=BY[SH.id].name;closeSheet();render();toast(nm+': в корзине')}
  if(a==='delLine'&&SH){M.cart.splice(SH.edit,1);closeSheet();render()}
  if(a==='place'){M.comment=($('ocomment')||{}).value||M.comment;var c2=client(M.client),o3={num:S.num++,client:M.client,date:M.date,lines:M.cart,comment:M.comment.trim(),sum:cartSum(),kg:cartKg(),cat:catOf(c2).id,by:S.me||'',created:Date.now(),status:0};
    S.orders.push(o3);save();M.cart=[];M.comment='';M.client=null;go('orders');toast('Заявка № '+o3.num+' оформлена')}
  if(a==='newClient'){SH={type:'client',id:null,data:{cat:'base',type:'магазин',pay:'отсрочка 7 дней',docs:'ЭДО',days:'пн–сб'}};sheet(clientSheet())}
  if(a==='newKey'&&SH){collectClient();SH.data.key=newKey();sheet(clientSheet());toast('Ключ создан — не забудьте сохранить карту')}
  if(a==='copyKey'&&SH)copy(SH.data.key,'Ключ скопирован');
  if(a==='shareKey'&&SH){var ct2=catOf(SH.data);copy('Здравствуйте! Это «Фермерофф». Заказы теперь можно оформлять в приложении: '+location.href.replace(/[^/]*$/,'')+'\nВаш ключ доступа: '+SH.data.key+'\nЦены — по вашей категории «'+ct2.name+'». Заказ на завтра — до '+CUTOFF+':00.','Текст с ключом скопирован — отправьте клиенту')}
  if(a==='saveClient'&&SH){collectClient();var x2=SH.data,miss=QFIELDS.filter(function(f){return f[3]&&!String(x2[f[0]]||'').trim()}).map(function(f){return f[1]});
    if(miss.length){var er=$('cerr');er.textContent='Заполните: '+miss.join(', ');er.hidden=false;return}
    if(SH.id){var cc=client(SH.id);Object.assign(cc,x2)}else{x2.id='k'+(Date.now()%1e7);x2.created=Date.now();S.clients.unshift(x2)}save();var wasNew=!SH.id,nid=x2.id;closeSheet();render();toast(wasNew?'Клиент добавлен'+(x2.key?'':' — выдайте ему ключ'):'Карта сохранена');if(wasNew&&M.tab==='order'){M.client=nid;render()}}
  if(a==='orderFor'&&SH){var id=SH.id;closeSheet();M.client=id;M.cart=[];go('order')}
  if(a==='newCat'){SH={type:'cat',id:null,data:{name:'',pct:0,over:{},note:''}};sheet(catSheet())}
  if(a==='saveCat'&&SH){collectCat();var c3=SH.data;if(!String(c3.name).trim()){var e3=$('cterr');e3.textContent='Введите название категории';e3.hidden=false;return}
    if(SH.id){var i=S.cats.findIndex(function(z){return z.id===SH.id});S.cats[i]=c3}else{c3.id='c'+Date.now();S.cats.push(c3)}save();closeSheet();render();toast('Категория «'+c3.name+'» сохранена')}
});
function collectClient(){document.querySelectorAll('[data-q]').forEach(function(i){SH.data[i.dataset.q]=i.value})}
function collectCat(){document.querySelectorAll('[data-c]').forEach(function(i){SH.data[i.dataset.c]=i.dataset.c==='pct'?(parseFloat(String(i.value).replace(',','.'))||0):i.value});SH.data.over={};document.querySelectorAll('[data-ov]').forEach(function(i){var v=String(i.value).trim();if(v!=='')SH.data.over[i.dataset.ov]=parseFloat(v.replace(',','.'))||0})}
document.addEventListener('input',function(e){var t=e.target;
  if(t.id==='pq'){M.q=t.value;keep(t)}if(t.id==='cq'){M.cq=t.value;keep(t)}if(t.id==='kq'){M.kq=t.value;keep(t)}if(t.id==='ocomment')M.comment=t.value;
  if(SH&&SH.type==='cat'&&(t.dataset.c==='pct'||t.dataset.ov!=null)){collectCat();var st=document.querySelector('.sheet').scrollTop,id=t.dataset.c?'[data-c="pct"]':'[data-ov="'+t.dataset.ov+'"]',pos=t.selectionStart;sheet(catSheet());var n=document.querySelector(id),sh=document.querySelector('.sheet');sh.scrollTop=st;if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
});
function keep(t){var id=t.id,pos=t.selectionStart;render();var n=$(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&SH)closeSheet()});

/* ---------- gate ---------- */
function enter(){$('gate').hidden=true;$('app').hidden=false;$('tabs').hidden=false;load();$('who').textContent=S.me||'—';render()}
$('gateForm').addEventListener('submit',function(e){e.preventDefault();var k=$('mkey').value.trim(),er=$('gerr'),btn=this.querySelector('button[type=submit]');
  if(k.length<4){er.textContent='Введите ключ менеджера.';er.hidden=false;return}
  btn.disabled=true;btn.textContent='Проверяем…';
  unlock(k).then(function(){try{localStorage.setItem(KEYLS,k.toUpperCase())}catch(_){}load();S.me=$('mname').value.trim()||S.me||'Менеджер';save();enter()},function(){er.textContent='Ключ не подошёл.';er.hidden=false}).then(function(){btn.disabled=false;btn.textContent='Войти'});
});
var saved=null;try{saved=localStorage.getItem(KEYLS)}catch(_){}
if(saved)unlock(saved).then(enter,function(){try{localStorage.removeItem(KEYLS)}catch(_){}});
})();
</script>

<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}</script>
