<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B2826">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<title>Фермерофф · Офис</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=IBM+Plex+Mono:wght@500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: dark brand bar with section tabs, one fluid working area (max 1320px); tables scroll inside their own boxes on a phone; a side drawer opens an order */
:root{
  --bg:#E8E7E4; --surface:#F4F4F3; --card:#FFFFFF; --ink:#1E1C1A; --muted:#5F5954; --line:#DAD7D2;
  --maroon:#833B36; --maroon-ink:#F1EAE2; --maroon-soft:#F1DEDA; --cream:#F1EAE2;
  --dark:#2B2826; --dark-ink:#F4F1EC; --ok:#2F6B3A; --ok-soft:#DCEBDD; --warn:#8A4B0B; --warn-soft:#FBEBD3; --info:#1F4F86; --info-soft:#E1EBF6;
  --f-display:'Forum', Georgia, serif; --f-mono:'IBM Plex Mono','Courier New',monospace; --f-body:'Montserrat',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-synthesis:none;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--dark)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--maroon);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* gate */
#gate{min-height:100vh;background:var(--cream);display:flex;align-items:center;justify-content:center}
.gate-card{width:min(420px,100%);display:flex;flex-direction:column;gap:14px;padding-block:40px}
.gate-card .eb{display:flex;align-items:center;gap:12px;font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--maroon)}
.gate-card .eb span{flex:1;height:2px;background:var(--ink)}
.plate{align-self:center;background:var(--maroon);color:var(--cream);font-family:var(--f-display);font-size:42px;letter-spacing:1px;line-height:1;padding:14px 30px 12px;border-radius:22px}
.gate-card p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.5;text-align:center}
label.f{display:flex;flex-direction:column;gap:6px;font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--maroon)}
.in{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-family:var(--f-body);font-size:15px;letter-spacing:normal;text-transform:none;color:var(--ink);min-width:0}
.in.code{letter-spacing:2px;font-weight:700;text-transform:uppercase}
.err{color:var(--maroon);font-weight:700;font-size:13px}

/* bar */
header.bar{background:var(--dark);color:var(--dark-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
header.bar .wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{background:var(--maroon);color:var(--cream);font-family:var(--f-display);font-size:19px;letter-spacing:.5px;line-height:1;padding:7px 12px 5px;border-radius:10px}
.brand span{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#CFC8C0}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{border:0;background:transparent;color:#CFC8C0;font-size:14.5px;font-weight:600;padding:8px 12px;border-radius:10px;min-height:40px}
nav.tabs button.on{background:#45403C;color:#fff}
nav.tabs .cnt{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--maroon);color:var(--cream);font-size:11px;line-height:18px;text-align:center}
.bar .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.ghost-d{border:1px solid #57514C;background:transparent;color:#CFC8C0;border-radius:10px;padding:0 12px;height:36px;font-size:13px;font-weight:600}

main{padding-block:22px 60px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,4vw,44px);line-height:1.05}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:var(--maroon)}
.sub{font-size:14px;font-weight:700;color:var(--ok);margin-top:6px}
.sub.warn{color:var(--warn)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.pill{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--dark);border-color:var(--dark);color:var(--dark-ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{height:42px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;gap:8px}
.btn.main{background:var(--maroon);border-color:var(--maroon);color:var(--maroon-ink)}
.btn.dark{background:var(--dark);border-color:var(--dark);color:var(--dark-ink)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{font-size:28px;font-weight:800;line-height:1.15}
.kpi i{font-style:normal;font-size:12.5px;color:var(--muted)}
.cols{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-start}
.panel{background:var(--card);border-radius:16px;min-width:0}
.panel.grow{flex:999 1 620px}
.panel.side{flex:1 1 290px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:17px;font-weight:800}
.ptabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.ptabs button{border:0;background:transparent;font-weight:700;font-size:14px;color:var(--muted);padding:8px 12px;border-radius:10px;min-height:38px}
.ptabs button.on{background:var(--maroon-soft);color:var(--maroon)}
.ptabs .grow{flex:1}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;padding:11px 12px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-top:1px solid #EFEDEA;vertical-align:middle}
tr:first-child td{border-top:0}
td.r,th.r{text-align:right}
td.mono{font-family:var(--f-mono);font-size:12.5px}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#FAF8F6}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:var(--surface);display:block}
.name{display:flex;align-items:center;gap:10px;min-width:220px}
.name b{font-weight:700}
.name small{display:block;color:var(--muted);font-size:12px}
.st{display:inline-block;font-size:12px;font-weight:700;padding:4px 9px;border-radius:9px;white-space:nowrap}
.s0{background:#ECE6DE;color:#5E4630}.s1{background:var(--warn-soft);color:var(--warn)}.s2{background:var(--info-soft);color:var(--info)}.s3{background:var(--maroon-soft);color:var(--maroon)}.s4{background:var(--ok-soft);color:var(--ok)}.sx{background:#EEE;color:#666}
.src{font-size:11px;font-weight:700;color:var(--muted);font-family:var(--f-mono);letter-spacing:.5px}
.qin{width:84px;height:34px;border-radius:9px;border:1px solid var(--line);padding:0 8px;text-align:right;background:var(--card)}
.trip{background:var(--surface);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.trip b{white-space:nowrap}
.bar-p{height:10px;border-radius:5px;background:#ECE9E5;overflow:hidden}
.bar-p div{height:10px;background:var(--ok)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px;border-bottom:1px solid var(--line);align-items:center}
.toolbar .in{height:38px;font-size:14px}
.toolbar .search{flex:1 1 220px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.trips{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.stop{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid #EFEDEA}
.stop .n{width:28px;height:28px;border-radius:14px;background:var(--dark);color:var(--dark-ink);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stop .t{flex:1;min-width:0}
.stop .t b{display:block;font-size:14px}
.stop .t span{font-size:12px;color:var(--muted)}
.ib{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:15px;flex-shrink:0}
.tag{font-family:var(--f-mono);font-size:10px;font-weight:700;letter-spacing:1px;background:var(--dark);color:var(--dark-ink);padding:3px 7px;border-radius:7px;text-transform:uppercase}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(30,28,26,.4);z-index:50;display:flex;justify-content:flex-end}
.drawer{width:min(620px,100%);height:100%;background:var(--bg);overflow:auto;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:14px;animation:slide .2s ease}
@keyframes slide{from{transform:translateX(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.drawer h2{font-family:var(--f-display);font-weight:400;font-size:32px}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;color:var(--muted)}
.steps button.done{background:var(--ok-soft);border-color:var(--ok-soft);color:var(--ok)}
.steps button.cur{background:var(--maroon);border-color:var(--maroon);color:var(--maroon-ink)}
.box{background:var(--card);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.totals{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.totals b{font-family:var(--f-display);font-weight:400;font-size:30px}
.picker{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.picker button{display:flex;width:100%;align-items:center;gap:10px;border:0;border-top:1px solid #EFEDEA;background:transparent;padding:8px 10px;text-align:left}
.picker button:first-child{border-top:0}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:var(--dark-ink);padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:70;box-shadow:0 8px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px)}
.demo{font-size:12px;color:var(--muted);text-align:center}
/* picking cards: the paper sheet that replaces the pencil notes; two per A4 when printed */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:16px}
.pcard{background:#fff;color:#111;border-radius:6px;padding:22px 24px 18px;display:flex;flex-direction:column;gap:12px;font-family:var(--f-body);box-shadow:0 1px 0 var(--line)}
.pcard .ph{display:flex;align-items:center;gap:14px}
.pcard .ld{width:56px;height:56px;border:3px solid #111;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;flex-shrink:0}
.pcard .ph b{display:block;font-size:22px;font-weight:800;line-height:1.15}
.pcard .ph span{font-size:13.5px}
.pcard table{font-size:16px;border-collapse:collapse}
.pcard th{font-size:12.5px;color:#111;border:1.5px solid #111;padding:7px 9px;font-weight:700}
.pcard td{border:1.5px solid #111;padding:11px 9px;font-weight:700}
.pcard td.q{text-align:right;font-weight:800;white-space:nowrap}
.pcard td.w{width:96px}.pcard td.c{width:38px}
.pcard .mark{font-size:14px}
.pcard .foot{display:flex;gap:26px;font-size:14px;margin-top:auto;flex-wrap:wrap}
.pcard .scr{display:flex;gap:8px;flex-wrap:wrap}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  body::before,header.bar,.head,.demo,.toast,#overlay,.pcard .scr{display:none!important}
  main{padding:0!important;max-width:none!important}
  .sheet{display:block}
  .pcard{box-shadow:none;border-radius:0;padding:0 0 14px;margin-bottom:14px;border-bottom:2px dashed #111;break-inside:avoid;page-break-inside:avoid;min-height:128mm}
  .pcard:nth-child(2n){border-bottom:0;break-after:page;page-break-after:always}
}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi b{font-size:21px}.kpi{padding:12px}.bar .right{margin-left:0}nav.tabs button{padding:8px 10px;font-size:14px}}
</style>
</head>
<body>


<div id="gate">
  <form class="gate-card wrap" id="gateForm" novalidate>
    <div class="eb"><span></span>Офис · управление заказами<span></span></div>
    <div class="plate">ФЕРМЕРОФФ</div>
    <p>Панель для менеджеров, цеха и диспетчера. Введите офисный ключ — без него цены и заказы не открываются.</p>
    <label class="f" for="okey">Офисный ключ<input class="in code" id="okey" autocomplete="off" autocapitalize="characters" placeholder="OFC-XXXX-XXXX-XXXX"></label>
    <div class="err" id="gerr" hidden></div>
    <button class="btn main" type="submit" style="justify-content:center;height:48px">Войти</button>
  </form>
</div>

<div id="app" hidden>
  <header class="bar"><div class="wrap">
    <div class="brand"><div class="mark">ФЕРМЕРОФФ</div><span>Офис</span></div>
    <nav class="tabs" id="tabs" aria-label="Разделы">
      <button type="button" data-tab="plan">План</button>
      <button type="button" data-tab="orders">Заказы<span class="cnt" id="cntNew" hidden></span></button>
      <button type="button" data-tab="catalog">Каталог</button>
      <button type="button" data-tab="clients">Клиенты</button>
      <button type="button" data-tab="trips">Рейсы</button>
      <button type="button" data-tab="pick">Сборка</button>
    </nav>
    <div class="right"><button class="ghost-d" type="button" id="reset">Сбросить демо</button></div>
  </div></header>
  <main class="wrap" id="view"></main>
  <p class="demo wrap">Тестовая версия: каталог и цены — настоящие, клиенты и заказы — придуманные для примера. Данные хранятся в этом браузере.</p>
</div>
<div id="overlay"></div>
<div class="toast" id="toast" hidden></div>

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rub(n){return Math.round(n).toLocaleString('ru-RU')+' ₽'}
function kg(n){var v=Math.round(n*10)/10;return v.toLocaleString('ru-RU',{maximumFractionDigits:1})}
function plural(n,a,b,c){n=Math.abs(n)%100;var m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m==1)return a;return c}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function dateOf(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function nextWork(d,n){var x=new Date(d),k=0;while(k<n){x=addDays(x,1);if(x.getDay()!==0)k++}return x}
function dayLabel(s){var d=dateOf(s);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()].slice(0,3)}
function dayLong(s){var d=dateOf(s);return d.getDate()+' '+MON[d.getMonth()]}
var toastT;function toast(m){var t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2200)}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- price unlock ---------- */
function b64u8(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function unlock(key){
  if(!(window.crypto&&crypto.subtle))return Promise.reject(new Error('nocrypto'));
  return crypto.subtle.importKey('raw',new TextEncoder().encode(String(key).trim().toUpperCase()),'PBKDF2',false,['deriveKey']).then(function(base){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64u8(PRICE_BOX.s),iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])
  }).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b64u8(PRICE_BOX.i)},k,b64u8(PRICE_BOX.c))
  }).then(function(buf){var m=JSON.parse(new TextDecoder().decode(buf));P.forEach(function(p){var v=m[p.id];if(v){p.pp=v[0];p.pkg=v[1];p.ppx=!!v[2]}})});
}
function lineMoney(p,q,k){return p&&p.pp?q*(p.ppx?p.pp:p.pkg*p.w*(k||1)):0}

function seed(){
  var r=rng(20261023),now=new Date(),d1=iso(nextWork(now,1)),d2=iso(nextWork(now,2));
  var byName={};P.forEach(function(p){byName[p.name]=p.id});
  var pop=POP.map(function(n){return byName[n]}).filter(Boolean);
  var clients=CLIENT_SEED.map(function(c,i){return {id:'c'+(i+1),name:c[0],addr:c[1],win:c[2],zone:c[3],key:'FRM-'+(1000+i*37)+'-DEMO',on:true}});
  var orders=[],num=1101;
  function mk(cl,date,status,src,n){var lines=[],used={};for(var k=0;k<n;k++){var id=r()<0.75?pop[Math.floor(r()*pop.length)]:P[Math.floor(r()*P.length)].id;if(used[id])continue;used[id]=1;var p=BY[id];var q=p.unit==='уп.'?1+Math.floor(r()*(p.w<0.2?20:8)):1+Math.floor(r()*6);lines.push({id:id,q:q})}
    var o={num:num++,client:cl.id,date:date,status:status,src:src,lines:lines,comment:r()<0.2?'позвонить за 30 минут':'',created:Date.now()-Math.floor(r()*86400000)};
    if(status>=2)o.fact=lines.map(function(){return 0.96+r()*0.07});return o}
  // past delivered
  for(var b=1;b<=3;b++){var pd=iso(addDays(now,-b));clients.slice(0,8).forEach(function(c,i){if(r()<0.6)orders.push(mk(c,pd,4,r()<0.7?'app':'phone',3+Math.floor(r()*3)))})}
  // tomorrow: 23 orders from 21 clients
  clients.forEach(function(c){orders.push(mk(c,d1,r()<0.35?1:0,r()<0.7?'app':'phone',2+Math.floor(r()*5)))});
  orders.push(mk(clients[0],d1,0,'phone',2));orders.push(mk(clients[8],d1,0,'app',3));
  // day after: preliminary
  clients.slice(0,14).forEach(function(c){if(r()<0.85)orders.push(mk(c,d2,0,'app',2+Math.floor(r()*4)))});
  return {v:1,clients:clients,orders:orders,stock:{},trips:{},num:num,active:{}};
}

function dates(){var now=new Date();return {d1:iso(nextWork(now,1)),d2:iso(nextWork(now,2)),today:iso(now)}}
function cl(id){for(var i=0;i<S.clients.length;i++)if(S.clients[i].id===id)return S.clients[i];return {name:'—',addr:'',win:'',zone:1}}
function ordersOn(date){return S.orders.filter(function(o){return o.date===date&&!o.cancel})}
function oKg(o){return o.lines.reduce(function(s,l,i){var p=BY[l.id];return s+(p?l.q*p.w*(o.fact&&o.status>=2?o.fact[i]||1:1):0)},0)}
function oSum(o){return o.lines.reduce(function(s,l,i){return s+lineMoney(BY[l.id],l.q,o.fact&&o.status>=2?o.fact[i]||1:1)},0)}
function stCls(o){return o.cancel?'sx':'s'+o.status}
function stName(o){return o.cancel?'Отменён':STATUSES[o.status]}
function closed(date){var d=dates();return date===d.d1&&new Date().getHours()>=CUTOFF}

/* trips: orders of a date split by zone, then kept in the dispatcher's order */
function tripsFor(date){
  var list=ordersOn(date),t=S.trips[date]||{1:[],2:[]};
  [1,2].forEach(function(k){t[k]=(t[k]||[]).filter(function(n){return list.some(function(o){return o.num===n})})});
  list.forEach(function(o){if(t[1].indexOf(o.num)<0&&t[2].indexOf(o.num)<0)t[cl(o.client).zone===2?2:1].push(o.num)});
  S.trips[date]=t;return t;
}
function byNum(n){for(var i=0;i<S.orders.length;i++)if(S.orders[i].num===n)return S.orders[i]}

function aggregate(date){
  var m={};ordersOn(date).forEach(function(o){o.lines.forEach(function(l){var p=BY[l.id];if(!p)return;var a=m[l.id]||(m[l.id]={p:p,q:0,kg:0,clients:{},sum:0});a.q+=l.q;a.kg+=l.q*p.w;a.clients[o.client]=1;a.sum+=lineMoney(p,l.q)})});
  return Object.keys(m).map(function(k){var a=m[k];a.nc=Object.keys(a.clients).length;return a}).sort(function(a,b){return a.p.ws.localeCompare(b.p.ws)||b.kg-a.kg});
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  if(e.target.classList&&e.target.classList.contains('scrim')){closeDrawer();return}
  var b=e.target.closest('button,tr[data-order]');if(!b)return;var ds=b.dataset,d=dates();
  if(ds.tab){go(ds.tab);return}
  if(ds.tabGo){go(ds.tabGo);return}
  if(ds.day!=null){UI.day=+ds.day;render();return}
  if(ds.ptab){UI.planTab=ds.ptab;render();return}
  if(ds.odate){UI.odate=ds.odate;render();return}
  if(ds.ptrip){UI.pickTrip=ds.ptrip;render();return}
  if(ds.picked){var po=byNum(+ds.picked);po.status=2;if(!po.fact)po.fact=po.lines.map(function(){return 1});save();render();toast('№ '+po.num+' собран');return}
  if(ds.order&&b.tagName==='BUTTON'&&UI.tab==='pick'){UI.open=+ds.order;UI.newOrder=null;openDrawer(drawOrder());return}
  if(ds.order){UI.open=+ds.order;UI.newOrder=null;openDrawer(drawOrder());return}
  if(ds.toggle){S.active[ds.toggle]=S.active[ds.toggle]===false;save();render();return}
  if(ds.cl){var c=cl(ds.cl);c.on=!c.on;save();render();toast(c.name+(c.on?': доступ включён':': доступ отключён'));return}
  if(ds.mv){var a=ds.mv.split(':'),t=S.trips[UI.day?d.d2:d.d1][a[0]],i=+a[1],j=i+(+a[2]);var x=t[i];t[i]=t[j];t[j]=x;save();render();return}
  if(ds.sw){var s=ds.sw.split(':'),tt=S.trips[UI.day?d.d2:d.d1],n=tt[s[0]].splice(+s[1],1)[0];tt[s[0]==='1'?2:1].push(n);save();render();toast('Точка перенесена в рейс '+(s[0]==='1'?2:1));return}
  var o=UI.open?byNum(UI.open):null;
  if(ds.status!=null&&o){o.status=+ds.status;if(o.status>=2&&!o.fact)o.fact=o.lines.map(function(){return 1});save();redrawDrawer();render();toast('№ '+o.num+': '+STATUSES[o.status]);return}
  if(ds.del!=null&&o){o.lines.splice(+ds.del,1);save();redrawDrawer();render();return}
  if(ds.pickid){var inp=$('pq');if(inp&&inp.dataset.pick==='addline'&&o){var ex=o.lines.filter(function(l){return l.id===ds.pickid})[0];if(ex)ex.q++;else{o.lines.push({id:ds.pickid,q:1});if(o.fact)o.fact.push(1)}save();redrawDrawer();render()}
    else if(UI.newOrder){var ex2=UI.newOrder.lines.filter(function(l){return l.id===ds.pickid})[0];if(ex2)ex2.q++;else UI.newOrder.lines.push({id:ds.pickid,q:1});redrawDrawer()}
    toast(BY[ds.pickid].name+' добавлен');return}
  if(ds.ndel!=null){UI.newOrder.lines.splice(+ds.ndel,1);redrawDrawer();return}
  var act=ds.act;if(!act)return;
  if(act==='scrim'){if(e.target===b)closeDrawer();return}
  if(act==='close')closeDrawer();
  if(act==='cancel'&&o){o.cancel=true;save();redrawDrawer();render();toast('Заказ № '+o.num+' отменён')}
  if(act==='restore'&&o){o.cancel=false;save();redrawDrawer();render()}
  if(act==='copy'&&o){var c2=cl(o.client);copy('Заказ № '+o.num+' · '+c2.name+' · '+dayLabel(o.date)+'\n'+o.lines.map(function(l){var p=BY[l.id];return '• '+p.name+' — '+l.q+' '+p.unit}).join('\n')+(o.comment?'\nПометка: '+o.comment:''),'Состав заказа скопирован')}
  if(act==='newOrder'){UI.open=null;UI.newOrder={client:S.clients[0].id,date:d.d1,comment:'',lines:[]};openDrawer(drawNewOrder())}
  if(act==='saveNew'){var nn=UI.newOrder;nn.client=$('nclient').value;nn.date=$('ndate').value;nn.comment=$('ncomment').value;var no={num:S.num++,client:nn.client,date:nn.date,status:0,src:'phone',lines:nn.lines,comment:nn.comment,created:Date.now()};S.orders.push(no);save();UI.newOrder=null;UI.open=no.num;redrawDrawer();render();toast('Заказ № '+no.num+' создан')}
  if(act==='newClient'){UI.open=null;UI.newOrder=null;openDrawer(drawNewClient())}
  if(act==='saveClient'){var nm=$('kname').value.trim();if(!nm){toast('Введите название клиента');return}var id='c'+(S.clients.length+1),key='FRM-'+Math.random().toString(36).slice(2,6).toUpperCase()+'-'+Math.random().toString(36).slice(2,6).toUpperCase();S.clients.push({id:id,name:nm,addr:$('kaddr').value.trim(),win:$('kwin').value.trim(),zone:+$('kzone').value,key:key,on:true});save();closeDrawer();toast('Клиент создан, ключ '+key)}
  if(act==='csv'){var date=UI.day?d.d2:d.d1;csvDownload('план-'+date+'.csv',[['Продукция','Цех','Количество','Ед.','Вес, кг','Остаток, кг','Произвести, кг','Клиентов']].concat(aggregate(date).map(function(a){var st=+(S.stock[date]||{})[a.p.id]||0;return [a.p.name,a.p.ws,a.q,a.p.unit,kg(a.kg),st,kg(Math.max(0,(a.kg-st)*1.05)),a.nc]})))}
  if(act==='print'){if(window.self!==window.top){toast('В превью печать недоступна — откройте панель на сайте')}else{window.print()}}
  if(act==='masters')copy(planText(UI.day?d.d2:d.d1),'План для цехов скопирован — вставьте в Telegram мастерам');
  if(act==='sendTrips'){var dt=UI.day?d.d2:d.d1,tr=tripsFor(dt);copy([1,2].map(function(k){return 'РЕЙС '+k+' · '+dayLabel(dt)+'\n'+tr[k].map(function(n,i){var oo=byNum(n),cc=cl(oo.client);return (i+1)+'. '+cc.name+' — '+cc.addr+' ('+cc.win+')'}).join('\n')}).join('\n\n'),'Рейсы скопированы — отправьте водителям')}
});
document.addEventListener('input',function(e){
  var t=e.target,ds=t.dataset,d=dates();
  if(t.id==='oq'){UI.oq=t.value;keepFocus(t)}
  if(t.id==='cq'){UI.cq=t.value;keepFocus(t)}
  if(ds.stock){var date=UI.day?d.d2:d.d1;(S.stock[date]=S.stock[date]||{})[ds.stock]=parseFloat(t.value.replace(',','.'))||0;save();keepFocus(t)}
  var o=UI.open?byNum(UI.open):null;
  if(ds.q!=null&&o){var q=parseInt(t.value,10);if(q>0){o.lines[+ds.q].q=q;save();render();updTotals()}}
  if(ds.f!=null&&o){var p=BY[o.lines[+ds.f].id],w=parseFloat(t.value.replace(',','.'));if(w>0){o.fact[+ds.f]=w/(o.lines[+ds.f].q*p.w);save();render();updTotals()}}
  if(ds.nq!=null){var q2=parseInt(t.value,10);if(q2>0){UI.newOrder.lines[+ds.nq].q=q2;updTotals()}}
  if(t.id==='pq'){var pl=$('plist');pl.innerHTML=pickList(t.value);pl.hidden=!t.value.trim()}
});
document.addEventListener('change',function(e){var t=e.target;if(t.id==='ostatus'){UI.ostatus=t.value;render()}if(t.id==='ccat'){UI.ccat=t.value;render()}if(t.id==='nclient'&&UI.newOrder)UI.newOrder.client=t.value;if(t.id==='ndate'&&UI.newOrder)UI.newOrder.date=t.value;if(t.id==='ncomment'&&UI.newOrder)UI.newOrder.comment=t.value});
function keepFocus(t){var id=t.id,ds=Object.assign({},t.dataset),pos=t.selectionStart;render();var n=id?$(id):document.querySelector('[data-stock="'+ds.stock+'"]');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(_){}}}
function updTotals(){var dr=document.querySelector('.drawer');if(!dr)return;var tb=dr.querySelector('.totals b');var tx=dr.querySelector('.totals .hint');
  if(UI.newOrder){tb.textContent=rub(UI.newOrder.lines.reduce(function(s,l){return s+lineMoney(BY[l.id],l.q)},0))}else{var o=byNum(UI.open);tb.textContent=rub(oSum(o));tx.textContent=(o.status>=2?'По фактическому весу':'Примерно, до взвешивания')+' · '+kg(oKg(o))+' кг'}}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('overlay').innerHTML)closeDrawer()});
$('reset').addEventListener('click',function(){S=seed();save();UI.open=null;closeDrawer();toast('Демо-данные сброшены')});

/* ---------- gate ---------- */
var KEYLS='ferm-office-key';
function enter(){$('gate').hidden=true;$('app').hidden=false;load();render()}
$('gateForm').addEventListener('submit',function(e){e.preventDefault();var k=$('okey').value.trim(),er=$('gerr'),btn=this.querySelector('button');
  if(k.length<4){er.textContent='Введите офисный ключ.';er.hidden=false;return}
  btn.disabled=true;btn.textContent='Проверяем…';
  unlock(k).then(function(){try{localStorage.setItem(KEYLS,k.toUpperCase())}catch(_){}enter()},function(){er.textContent='Ключ не подошёл.';er.hidden=false}).then(function(){btn.disabled=false;btn.textContent='Войти'});
});
var saved=null;try{saved=localStorage.getItem(KEYLS)}catch(_){}
if(saved)unlock(saved).then(enter,function(){try{localStorage.removeItem(KEYLS)}catch(_){}});
})();
</script>
